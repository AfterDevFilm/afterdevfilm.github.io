<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="개발자의 필름 생활을 지켜주세요. 현상후 후원 페이지입니다.">
  <meta name="robots" content="noindex,nofollow">
  <title>개발자의 필름 생활을 지켜주세요! · 현상후</title>
  <link rel="icon" href="assets/app-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="brand-lockup">
      <img class="app-icon" src="assets/app-icon.png" width="56" height="56" alt="">
      <div>
        <p class="brand-name">현상후 AfterDev</p>
        <p class="preview-label">개발자 후원</p>
      </div>
    </header>

    <header class="start-heading">
      <p class="kicker">필름 생활 유지보수 접수처</p>
      <h1>개발자의 필름 생활을 지켜주세요!</h1>
      <p class="lede">현상후는 무료입니다.<br>필름은 아니지만요.</p>
    </header>

    <section class="info-card notice" aria-label="안내">
      <p>후원하지 않아도 모든 기능을 똑같이 쓸 수 있습니다.</p>
      <p>후원은 선택입니다.</p>
    </section>

    <section class="support-card" aria-label="후원">
      <p>작은 깜짝 선물이 숨어 있을지도요.</p>
      <a class="primary" data-support-link href="https://ko-fi.com/afterdevfilm" rel="noopener noreferrer">Buy me a film <span aria-hidden="true">↗</span></a>
      <p class="helper">Ko-fi에서 후원할 금액을 정해 주세요. 결제 통화는 미국 달러(USD)입니다.</p>
    </section>

    <p class="footer-line">후원은 선택. 사진 생활은 계속.</p>
  </main>
  <script defer src="support-link.js?v=12"></script>
</body>
</html>
